[workspace]
resolver = "2"
members = [
    "crash-handler",
    "minidumper",
    "minidumper-test",
    "sadness-generator",
]

[workspace.package]
repository = "https://github.com/EmbarkStudios/crash-handling"
authors = [
    "Embark <opensource@embark-studios.com>",
    "Jake Shadle <jake.shadle@embark-studios.com>",
]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88.0"

[profile.dev]
debug = 2

[workspace.dependencies]
cfg-if = "1.0"
# Must be kept aligned with the version used by minidump-writer
crash-context = "0.8"
libc = ">=0.2.180"
mach2 = "0.6"
parking_lot = "0.12"
